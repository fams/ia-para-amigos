name: Build and publish Slidev

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Build
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base "/${REPOSITORY_NAME}/"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node --test tests/markov-ranges.test.mjs
      - name: Package dev PR preview
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        run: |
          mkdir -p "${RUNNER_TEMP}/slidev-preview/offline/ia-para-amigos"
          cp -a dist/. "${RUNNER_TEMP}/slidev-preview/offline/ia-para-amigos/"
          cp scripts/apresentar.py scripts/README-preview.txt "${RUNNER_TEMP}/slidev-preview/"
          (cd "${RUNNER_TEMP}/slidev-preview" && zip -qr "${RUNNER_TEMP}/slidev-dev-preview.zip" .)
      - name: Attach dev PR preview
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        id: dev-preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/slidev-dev-preview.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Link dev PR preview in run summary
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        env:
          PREVIEW_URL: ${{ steps.dev-preview.outputs.artifact-url }}
        run: printf '[Baixar prévia da apresentação](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
